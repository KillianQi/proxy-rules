# upstreams.yaml — 各配置当前引用的第三方规则列表。
# 配置继续引用原地址；本仓库只在 vendor/ 保存每日快照，供上游失效时应急切换。
# 字段：url 原地址；path 快照路径；license 上游许可证；kind text|binary；
#       min_lines（text）/ min_bytes（binary）下限；enabled=false 表示不在公开仓库存快照。
# 同步保护：抓取失败、低于下限、或比上次快照缩水超过一半 → 保留旧快照并在 Actions 中告警。
